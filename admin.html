<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - Movie Recaps Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { padding: 20px; max-width: 600px; margin: auto; color: white; }
        .admin-container h2 { text-align: center; color: #E50914; margin-bottom: 20px; }
        .admin-container input, .admin-container textarea {
            width: 100%; padding: 12px; margin: 8px 0; background: #19191F; 
            border: 1px solid #333; color: white; border-radius: 8px; font-family: inherit;
        }
        .admin-container button {
            width: 100%; padding: 15px; background: #E50914; color: white; 
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .copy-container { display: flex; gap: 10px; margin: 8px 0; align-items: center;}
        .copy-container input { margin: 0; flex: 1; }
        .copy-btn {
            width: 80px; margin: 0 !important; background: #333; padding: 12px; font-size: 16px; border-radius: 8px; color: white; border: none; cursor: pointer;
        }
    </style>
</head>
<body style="background-color: #0B0B0F;">
    <div class="admin-container">
        <h2>لوحة تحكم المشرف</h2>
        
        <input type="text" id="movieTitle" placeholder="اسم الفيلم (مثال: Inception)">
        <input type="number" id="movieYear" placeholder="سنة الإنتاج (مثال: 2010)">
        <input type="text" id="movieDirector" placeholder="المخرج (مثال: Christopher Nolan)">
        <input type="text" id="movieGenres" placeholder="التصنيفات (أكشن, خيال علمي)">
        
        <textarea id="movieSynopsis" rows="3" placeholder="نبذة عن الفيلم..."></textarea>
        <textarea id="supervisorOpinion" rows="4" placeholder="رأي المشرف (إنت)..."></textarea>
        
        <input type="number" id="supervisorRating" placeholder="تقييم المشرف من 10" min="0" max="10" step="0.1">
        
        <div class="copy-container">
            <input type="url" id="youtubeLink" placeholder="رابط فيديو اليوتيوب (https://youtube.com/...)">
            <button type="button" class="copy-btn" onclick="copyLink()">نسخ</button>
        </div>
        
        <button onclick="saveMovie()">حفظ الفيلم</button>
    </div>

    <script>
        window.copyLink = function() {
            const linkInput = document.getElementById('youtubeLink');
            if(!linkInput.value) {
                alert("اكتب رابط الأول عشان تنسخه!");
                return;
            }
            navigator.clipboard.writeText(linkInput.value).then(() => {
                alert("تم نسخ الرابط بنجاح! 📋");
            }).catch(err => {
                alert("مش عارف أنسخ، جرب تنسخ يدوي.");
            });
        }
    </script>
    <script type="module" src="admin.js"></script>
</body>
</html>
